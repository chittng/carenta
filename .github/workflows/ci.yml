name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The Postgres started from compose.yaml below.
      DATABASE_URL: postgresql://carenta:carenta@localhost:5432/carenta
    steps:
      - uses: actions/checkout@v7

      # pnpm and Node versions come from "devEngines" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      # Generated Prisma client is needed by type-aware lint and typecheck
      - run: pnpm db:generate

      - run: pnpm lint

      - run: pnpm typecheck

      # Same services as local development, for the integration tests (test/*.integration.spec.ts)
      - name: Start Postgres, Valkey, RustFS and Mailpit
        run: |
          docker compose up -d --wait postgres valkey rustfs mailpit
          docker compose run --rm rustfs-init

      - run: pnpm --filter @carenta/api exec prisma migrate deploy

      - run: pnpm test
        env:
          INTEGRATION: '1'
